<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta
		name="description"
		content="Manage your Voss Kitchen account."
	>

	<meta name="theme-color" content="#f6f3ed">

	<link rel="icon" href="favicon.ico" type="image/x-icon">

	<title>My Account — Voss Kitchen</title>

	<link rel="stylesheet" href="css/styles.css">
</head>

<body>

	<header class="site-header">
		<div class="container header-inner">

			<a href="index.html" class="site-logo">
				<span class="logo-name">Voss</span>
				<span class="logo-kitchen">Kitchen</span>
			</a>

			<nav class="main-nav" aria-label="Main navigation">

				<a href="index.html" class="nav-link">
					Recipes
				</a>

				<a href="#" class="nav-link">
					About
				</a>

				<a
					href="add-recipe.html"
					class="nav-link"
					id="add-recipe-nav-link"
					style="display: none;"
				>
					Add Recipe
				</a>

				<a
					href="admin.html"
					class="nav-link"
					id="admin-nav-link"
					style="display: none;"
				>
					Admin
				</a>

				<a
					href="account.html"
					class="nav-link active"
					id="account-nav-link"
				>
					My Account
				</a>

				<a
					href="login.html"
					class="nav-link"
					id="auth-nav-link"
				>
					Log In
				</a>

			</nav>

		</div>
	</header>


	<main>

		<section class="auth-section">

			<div class="container">

				<div class="auth-card">

					<div class="auth-header">

						<p class="eyebrow">Voss Kitchen</p>

						<h1>My Account</h1>

						<p>
							Manage your account settings.
						</p>

					</div>


					<div class="account-section">

						<h2>Account Information</h2>

						<div class="account-info">

							<div class="form-field">

								<label for="account-email">
									Email
								</label>

								<input
									type="email"
									id="account-email"
									readonly
								>

							</div>


							<div class="form-field">

								<label for="account-display-name">
									Display Name
								</label>

								<input
									type="text"
									id="account-display-name"
									autocomplete="name"
									maxlength="100"
								>

							</div>

							<button
								type="button"
								class="secondary-button"
								id="save-display-name-button"
							>
								Save Display Name
							</button>

						</div>

					</div>


					<div class="account-section">

						<h2>Security</h2>

						<p>
							Change your password or manage your
							account security settings.
						</p>

						<a
							href="change-password.html"
							class="secondary-button"
						>
							Change Password
						</a>

					</div>


					<div
						id="account-message"
						class="auth-message"
						role="status"
						aria-live="polite"
					></div>

				</div>

			</div>

		</section>

	</main>


	<footer class="site-footer">
		<div class="container footer-inner">

			<p>
				© <span id="current-year"></span> Voss Kitchen
			</p>

			<p class="footer-tagline">
				Recipes worth keeping.
			</p>

		</div>
	</footer>


	<!-- Supabase JavaScript client -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<!-- Supabase / Voss Kitchen configuration -->
	<script src="js/app.js"></script>

	<!-- Authentication -->
	<script src="js/auth.js"></script>

	<!-- Account page -->
	<script src="js/account.js"></script>

</body>

</html>
