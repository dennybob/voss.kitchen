<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Recipe | Voss Kitchen</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="site-logo">Voss Kitchen</a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link">Recipes</a>
        <a href="admin.html" class="nav-link">Admin</a>
        <a href="login.html" class="nav-link" id="auth-nav-link">Log In</a>
      </nav>

    </div>
  </header>


  <main class="container">

    <section class="recipe-form-section">

      <div class="recipe-form-header">
        <p class="eyebrow">Recipe Management</p>
        <h1>Add a Recipe</h1>
        <p>Add your recipe to Voss Kitchen</p>
      </div>

      <div id="recipe-form-message" class="auth-message"></div>


      <form id="recipe-form" class="recipe-form" novalidate>

        <!-- Basic Information -->
        <fieldset>
          <legend>Basic Information</legend>

          <div class="form-field">
            <label for="recipe-title">Title *</label>
            <input
              type="text"
              id="recipe-title"
              name="title"
              required
              maxlength="200"
              autocomplete="off"
            >
          </div>

          <div class="form-field">
            <label for="recipe-description">Description</label>
            <textarea
              id="recipe-description"
              name="description"
              rows="3"
              maxlength="1000"
            ></textarea>
          </div>

          <div class="form-field">
            <label for="recipe-category">Category</label>
            <input
              type="text"
              id="recipe-category"
              name="category"
              maxlength="100"
              placeholder="Bread, Main Dish, Dessert..."
              autocomplete="off"
            >
          </div>

          <div class="form-grid">

            <div class="form-field">
              <label for="recipe-servings">Servings</label>
              <input
                type="number"
                id="recipe-servings"
                name="servings"
                min="1"
                step="1"
              >
            </div>

            <div class="form-field">
              <label for="recipe-prep-time">Prep Time (minutes)</label>
              <input
                type="number"
                id="recipe-prep-time"
                name="prep_time"
                min="0"
                step="1"
              >
            </div>

            <div class="form-field">
              <label for="recipe-cook-time">Cook Time (minutes)</label>
              <input
                type="number"
                id="recipe-cook-time"
                name="cook_time"
                min="0"
                step="1"
              >
            </div>

          </div>
        </fieldset>


        <!-- Ingredients -->
        <fieldset>
          <legend>Ingredients</legend>

          <p class="form-help">
            Add each ingredient as a separate line.
          </p>

          <div id="ingredients-list" class="ingredients-list"></div>

          <button
            type="button"
            id="add-ingredient"
            class="secondary-button"
          >
            + Add Ingredient
          </button>
        </fieldset>


        <!-- Instructions -->
        <fieldset>
          <legend>Instructions</legend>

          <div class="form-field">
            <label for="recipe-instructions">Cooking Instructions *</label>
            <textarea
              id="recipe-instructions"
              name="instructions"
              rows="12"
              required
            ></textarea>
          </div>
        </fieldset>


        <!-- Notes -->
        <fieldset>
          <legend>Notes</legend>

          <div class="form-field">
            <label for="recipe-notes">Additional Notes</label>
            <textarea
              id="recipe-notes"
              name="notes"
              rows="5"
            ></textarea>
          </div>
        </fieldset>


        <!-- Image -->
        <fieldset>
          <legend>Recipe Image</legend>

          <div class="form-field">
            <label for="recipe-image">Image</label>

            <input
              type="file"
              id="recipe-image"
              name="image"
              accept="image/jpeg,image/png,image/webp"
            >

            <p class="form-help">
              JPG, PNG, or WebP.
            </p>
          </div>

          <div id="image-preview-container" class="image-preview-container">
            <img
              id="image-preview"
              class="image-preview"
              alt="Recipe image preview"
            >
          </div>
        </fieldset>


        <!-- Form Actions -->
        <div class="recipe-form-actions">

          <a href="index.html" class="secondary-button">
            Cancel
          </a>

          <button
            type="submit"
            id="save-recipe"
            class="primary-button"
          >
            Save Recipe
          </button>

        </div>

      </form>

    </section>

  </main>


  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> Voss Kitchen</p>
    </div>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recipe-form.js"></script>

</body>
</html>
