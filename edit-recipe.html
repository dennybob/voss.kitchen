<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Recipe | Voss Kitchen</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="site-header-inner">

      <a class="site-logo" href="index.html">Voss Kitchen</a>

      <nav class="site-nav">
        <a href="index.html">Recipes</a>
        <a href="add-recipe.html">Add Recipe</a>
        <a href="login.html" id="auth-nav-link">Log In</a>
      </nav>

    </div>
  </header>

  <main class="site-main">

    <div class="page-heading">
      <h1>Edit Recipe</h1>
      <p>Update the recipe information below.</p>
    </div>

    <form id="recipe-form" class="recipe-form">

      <section class="recipe-form-section">
        <h2>Basic Information</h2>

        <div class="form-grid">

          <div class="form-group form-group-full">
            <label for="recipe-title">Recipe Title *</label>
            <input
              type="text"
              id="recipe-title"
              maxlength="200"
              required
            >
          </div>

          <div class="form-group form-group-full">
            <label for="recipe-description">Description</label>
            <textarea
              id="recipe-description"
              rows="3"
              maxlength="1000"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="recipe-category">Category</label>
            <input
              type="text"
              id="recipe-category"
              maxlength="100"
            >
          </div>

          <div class="form-group">
            <label for="recipe-servings">Servings</label>
            <input
              type="number"
              id="recipe-servings"
              min="1"
              step="1"
            >
          </div>

          <div class="form-group">
            <label for="recipe-prep-time">Prep Time (minutes)</label>
            <input
              type="number"
              id="recipe-prep-time"
              min="0"
              step="1"
            >
          </div>

          <div class="form-group">
            <label for="recipe-cook-time">Cook Time (minutes)</label>
            <input
              type="number"
              id="recipe-cook-time"
              min="0"
              step="1"
            >
          </div>

        </div>
      </section>


      <section class="recipe-form-section">
        <h2>Ingredients</h2>

        <div id="ingredients-list" class="ingredients-list"></div>

        <button
          type="button"
          id="add-ingredient"
          class="secondary-button"
        >
          + Add Ingredient
        </button>
      </section>


      <section class="recipe-form-section">
        <h2>Instructions</h2>

        <div class="form-group">
          <label for="recipe-instructions">Cooking Instructions *</label>
          <textarea
            id="recipe-instructions"
            rows="12"
            required
          ></textarea>
        </div>
      </section>


      <section class="recipe-form-section">
        <h2>Notes</h2>

        <div class="form-group">
          <label for="recipe-notes">Additional Notes</label>
          <textarea
            id="recipe-notes"
            rows="5"
          ></textarea>
        </div>
      </section>


      <section class="recipe-form-section">
        <h2>Recipe Image</h2>

        <div class="form-group">
          <label for="recipe-image">Replace Image</label>
          <input
            type="file"
            id="recipe-image"
            accept="image/jpeg,image/png,image/webp"
          >
          <small>
            Leave blank to keep the existing image.
          </small>
        </div>

        <div
          id="image-preview-container"
          class="image-preview-container"
        >
          <img id="image-preview" alt="Recipe image preview">
        </div>
      </section>


      <div id="recipe-form-message" class="auth-message"></div>


      <div class="recipe-form-actions">
        <a href="index.html" class="secondary-button">Cancel</a>

        <button
          type="submit"
          id="save-recipe"
          class="primary-button"
        >
          Save Changes
        </button>
      </div>

    </form>

  </main>


  <footer class="site-footer">
    <p>&copy; <span id="current-year"></span> Voss Kitchen</p>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recipe-form.js"></script>

</body>
</html>
