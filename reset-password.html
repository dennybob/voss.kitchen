<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="description" content="Reset your Voss Kitchen password.">
	<meta name="theme-color" content="#f6f3ed">

	<link rel="icon" href="favicon.ico" type="image/x-icon">

	<title>Reset Password — Voss Kitchen</title>

	<link rel="stylesheet" href="css/styles.css">
</head>

<body>

	<header class="site-header">
		<div class="container header-inner">

			<a href="index.html" class="site-logo">
				<span class="logo-name">Voss</span>
				<span class="logo-kitchen">Kitchen</span>
			</a>

			<nav class="main-nav" aria-label="Main navigation">
				<a href="index.html" class="nav-link">Recipes</a>

				<a href="#" class="nav-link">About</a>

				<a
					href="add-recipe.html"
					class="nav-link"
					id="add-recipe-nav-link"
					style="display: none;"
				>
					Add Recipe
				</a>

				<a
					href="admin.html"
					class="nav-link"
					id="admin-nav-link"
					style="display: none;"
				>
					Admin
				</a>

				<a href="login.html" class="nav-link" id="auth-nav-link">
					Log In
				</a>
			</nav>

		</div>
	</header>


	<main>

		<section class="auth-section">

			<div class="container">

				<div class="auth-card">

					<div class="auth-header">

						<p class="eyebrow">Voss Kitchen</p>

						<h1>Reset your password</h1>

						<p>
							Enter your email address and we'll send you a link
							to choose a new password.
						</p>

					</div>


					<form id="reset-form" class="auth-form">

						<div class="form-field">

							<label for="email">
								Email
							</label>

							<input
								type="email"
								id="email"
								name="email"
								autocomplete="email"
								required
							>

						</div>


						<button
							type="submit"
							class="auth-submit"
							id="reset-button"
						>
							Send Reset Link
						</button>


						<div
							id="reset-message"
							class="auth-message"
							role="status"
							aria-live="polite"
						></div>


						<div class="auth-back-link">
							<a href="login.html">Back to Log In</a>
						</div>

					</form>

				</div>

			</div>

		</section>

	</main>


	<footer class="site-footer">
		<div class="container footer-inner">

			<p>
				© <span id="current-year"></span> Voss Kitchen
			</p>

			<p class="footer-tagline">
				Recipes worth keeping.
			</p>

		</div>
	</footer>


	<!-- Supabase JavaScript client -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<!-- Supabase / Voss Kitchen configuration -->
	<script src="js/app.js"></script>

	<!-- Authentication -->
	<script src="js/auth.js"></script>

	<!-- Password reset request -->
	<script src="js/reset-password.js"></script>

</body>

</html>
